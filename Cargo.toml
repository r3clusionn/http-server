[package]
name = "tinyhttp"
version = "0.1.0"
edition = "2021"
description = "An HTTP/1.1 server built on std::net only: strict parsing, routing, keep-alive, pipelining, chunked transfer, ranges and a static file server."
license = "MIT"

[lib]
name = "tinyhttp"

[[bin]]
name = "tinyhttp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
debug = false
